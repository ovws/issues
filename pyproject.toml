[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "internal-ai-api"
version = "0.1.0"
description = "Windows-native LAN gateways for Grok, Gemini and ChatGPT image APIs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "gemini-webapi",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
internal-ai-key = "internal_ai_api.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/internal_ai_api"]

[tool.uv.sources]
gemini-webapi = { path = "upstream/gemini-api", editable = true }

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
